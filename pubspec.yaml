name: paylite
description: "PayLite - UPI-style person-to-person payments with QR scan-and-pay"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation & Routing
  go_router: ^14.0.0

  # Networking
  dio: ^5.4.3+1

  # Security & Storage
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0

  # Hardware & Device Integration
  mobile_scanner: ^5.1.1
  flutter_contacts: ^1.1.8

  # Sharing
  share_plus: ^9.0.0

  # Utilities & Formatting
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
